global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "devops-lab-ca2-netflix"

scrape_configs:
  - job_name: "catalog-service"
    static_configs:
      - targets: ["catalog-service:8001"]
    metrics_path: "/metrics"

  - job_name: "recommendation-service"
    static_configs:
      - targets: ["recommendation-service:8002"]
    metrics_path: "/metrics"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
