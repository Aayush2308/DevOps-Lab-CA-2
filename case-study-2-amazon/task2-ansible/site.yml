---
# Amazon Ansible Playbook — Task 2: Configuration Management
# Theme: Automates server setup for Amazon's independent microservices
# Demonstrates: same role, different variables — like different two-pizza teams
# using shared infra playbooks but with team-specific configs

- name: Configure Amazon app server (orders team)
  hosts: app_servers
  become: false
  gather_facts: true

  roles:
    - role: app-server
      vars:
        app_name: "amazon-orders"
        app_user: "{{ ansible_user_id }}"
        log_dir: "/tmp/devops-amazon-logs"
        config_dir: "/tmp/devops-amazon-config"
        app_port: 8003
        app_env: "{{ app_env | default('production') }}"

- name: Configure Amazon app server (inventory team)
  hosts: app_servers
  become: false
  gather_facts: true

  roles:
    - role: app-server
      vars:
        app_name: "amazon-inventory"
        app_user: "{{ ansible_user_id }}"
        log_dir: "/tmp/devops-amazon-logs"
        config_dir: "/tmp/devops-amazon-config"
        app_port: 8004
        app_env: "{{ app_env | default('production') }}"
