---
# roles/app-server/tasks/main.yml
# Demonstrates idempotency. We use user-level paths to avoid requiring sudo.

- name: Ensure application log directory exists
  ansible.builtin.file:
    path: "{{ log_dir }}"
    state: directory
    mode: "0755"
  tags: directories

- name: Ensure config directory exists
  ansible.builtin.file:
    path: "{{ config_dir }}"
    state: directory
    mode: "0750"
  tags: directories

- name: Deploy app config from template
  ansible.builtin.template:
    src: app.conf.j2
    dest: "{{ config_dir }}/app.conf"
    mode: "0640"
    backup: true
  notify: Restart app service   # Handler fires only if this task changes something
  tags: config
