global:
  scrape_interval: 15s
  external_labels:
    monitor: "devops-lab-ca2-amazon"

scrape_configs:
  - job_name: "orders-service"
    static_configs:
      - targets: ["orders-service:8003"]
    metrics_path: "/metrics"

  - job_name: "inventory-service"
    static_configs:
      - targets: ["inventory-service:8004"]
    metrics_path: "/metrics"

  - job_name: "payments-service"
    static_configs:
      - targets: ["payments-service:8005"]
    metrics_path: "/metrics"
